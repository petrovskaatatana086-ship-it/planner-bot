# Include inside the existing HTTPS server for calendar.tatyana-petrovskaya.ru.
location = /meetly {
    return 308 /meetly/;
}
location ^~ /meetly/ {
    access_log off;
    proxy_pass http://127.0.0.1:8012/miniapp/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
location ^~ /api/meetly/v1/ {
    access_log off;
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8012/api/meetly/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 90s;
    proxy_next_upstream off;
}
