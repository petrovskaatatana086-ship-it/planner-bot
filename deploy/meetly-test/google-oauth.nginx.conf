# Optional: include inside the existing HTTPS server only when test OAuth is ready.
# Keep the production /google/oauth/callback route on port 8012.
location = /meetly-test/google/oauth/callback {
    access_log off;
    proxy_pass http://127.0.0.1:8013/google/oauth/callback;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_next_upstream off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}
