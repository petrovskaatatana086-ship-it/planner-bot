# Include only in the existing HTTPS server block for the test app's origin.
# Existing production locations and 8012 remain unchanged.
location = /meetly-test/miniapp {
    return 308 /meetly-test/miniapp/;
}
location ^~ /meetly-test/miniapp/ {
    access_log off;
    proxy_pass http://127.0.0.1:8013/miniapp/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
location ^~ /meetly-test/api/meetly/v1/ {
    access_log off;
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8013/api/meetly/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 90s;
    proxy_next_upstream off;
}
