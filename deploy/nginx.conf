server {
    listen 80;
    listen [::]:80;
    server_name calendar.tatyana-petrovskaya.ru;
    root /var/www/calendar.tatyana-petrovskaya.ru;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://calendar.tatyana-petrovskaya.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name calendar.tatyana-petrovskaya.ru;

    ssl_certificate /etc/letsencrypt/live/calendar.tatyana-petrovskaya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calendar.tatyana-petrovskaya.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/calendar.tatyana-petrovskaya.ru.access.log calendar_bot;
    error_log /var/log/nginx/calendar.tatyana-petrovskaya.ru.error.log;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = / { default_type text/plain; return 200 "Meeting assistant is running. Open the Telegram bot: https://t.me/my_meeting_helper_23_bot\n"; }
    location = /health {
        proxy_pass http://127.0.0.1:8012;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    location = /google/oauth/callback {
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
    location = /telegram/webhook {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_next_upstream off;
    }
    location / { return 404; }
}
